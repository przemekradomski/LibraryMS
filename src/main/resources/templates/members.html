<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/normalize.css">
    <title>Członkowie</title>
</head>
<body>
    <nav>
        <a href="/">Główna</a>
        <a href="/books">Książki</a>
        <a href="/members">Członkowie</a>
        <a href="/reservations">Rezerwacje</a>
        <a href="/users">Użytkownicy</a>
        <div class="nav-actions">
            <button id="addMember" name="addMember" class="btn-primary">➕ Dodaj Członka</button>
        </div>
    </nav>
   <div id="addMemberForm" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h2>Dodaj Członka</h2>
            <button class="modal-close" id="closeForm">✕</button>
        </div>
        <form th:action="@{/members}" method="post">
            <div class="form-group">
                <label>Imię</label>
                <input type="text" name="firstName" placeholder="Na przykład Jan">
            </div>
            <div class="form-group">
                <label>Nazwisko</label>
                <input type="text" name="lastName" placeholder="Na przykład Kowalski">
            </div>
            <div class="form-group">
                <label>Adres e-mail</label>
                <input type="email" name="email" placeholder="Na przykład jankowalski@kontakt.pl">
            </div>
            <div class="form-group">
                <label>Numer telefonu</label>
                <input type="tel" name="phoneNumber" placeholder="Na przykład +48 123 456 789">
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" id="cancelForm">Anuluj</button>
                <button type="submit" class="btn-primary">Zapisz</button>
            </div>
        </form>
    </div>
</div>
    </div>
<div class="container">
    <h1>Członkowie</h1>
    <ul class="member-list">
        <li th:each="member : ${members}">
            <span th:text="${member.firstName}">Imie członka</span>
            <br>
            <span th:text="${member.lastName}">Nazwisko Członka</span>
            <br>
            <span th:text="${member.email}">Adres e-mail członka</span>
            <form th:action="@{/members/{id}/delete(id=${member.id})}" method="post">
                <button type="submit" class="btn-danger btn-small">Usuń</button>
            </form>
        </li>
    </ul>
</div>
    <script src="/js/script.js"></script>
    <script src="/js/cookies.js"></script>
</body>
</html>
