<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Książki</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/normalize.css">
</head>
<body>
<div id="cookie-banner" class="hide-banner">
    <p>Ta strona wykorzystuje pliki cookie aby zapewnić najlepsze doświadczenie użytkownika</p>
    <div class="cookie-buttons">
        <button id="accept-cookies">Akceptuj</button>
        <button id="decline-cookies">Odrzuć</button>
    </div>
</div>

<nav>
    <a href="/">Główna</a>
    <a href="/books">Książki</a>
    <a href="/members">Członkowie</a>
    <a href="/reservations">Rezerwacje</a>
    <a href="/users">Użytkownicy</a>
    <div class="nav-actions">
        <button class="btn-primary" id="addBook">+ Dodaj książkę</button>
        <!-- <button class="btn-danger" id="deleteBook">Usuń książkę</button> -->
    </div>
</nav>

<div id="addBooksForm" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header">
            <h2>Dodaj książkę</h2>
            <button class="modal-close" id="closeForm">✕</button>
        </div>
        <form th:action="@{/books}" method="post">
            <div class="form-group">
                <label for="title">Tytuł</label>
                <input type="text" id="title" name="title" placeholder="Wprowadź tytuł książki">
            </div>
            <div class="form-group">
                <label for="author">Autor</label>
                <input type="text" id="author" name="author" placeholder="Imię i nazwisko autora">
            </div>
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="np. 978-83-000-0000-0">
            </div>
            <div class="form-group">
                <label for="publisher">Wydawnictwo</label>
                <input type="text" id="publisher" name="publisher" placeholder="Jakiego wydawnictwa jest ta książka">
            </div>
            <div class="form-group">
                <label for="publish-year">Rok wydania</label>
                <input type="number" id="publish-year" name="yearOfRelease" placeholder="Rok wydania ksiązki">
            </div>
            <div class="form-group">
                <label for="language">Język</label>
                <input type="text" id="language" name="language" placeholder="Język w jakim jest książka">
            </div>
            <div class="form-group">
                <label for="description">Opis</label>
                <input type="text" id="description" name="description" placeholder="Krótki opis książki">
            </div> 
            <div class="form-actions">
                <button type="button" class="btn-secondary" id="cancelForm">Anuluj</button>
                <button type="submit" class="btn-primary">Zapisz</button>
            </div>
        </form>
    </div>
</div>

<div class="container">
    <h1>Książki</h1>
    <ul class="book-list">
    <li th:each="book : ${books}">
        <span th:text="${book.title}">Tytuł książki</span>
        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" style="display:inline">
        <button type="submit" class="btn-danger btn-small">Usuń</button>
        </form>
    </li>
</ul>
    <p th:if="${#lists.isEmpty(books)}" class="empty-state">Brak książek w bibliotece.</p>
</div>

<script src="/js/cookies.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
