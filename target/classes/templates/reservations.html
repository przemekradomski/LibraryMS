<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezerwacje</title>
    <link rel="stylesheet" href="/css/normalize.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <a href="/">Główna</a>
    <a href="/books">Książki</a>
    <a href="/members">Członkowie</a>
    <a href="/reservations">Rezerwacje</a>
    <a href="/users">Użytkownicy</a>
</nav>
<div class="container">
    <h1>Rezerwacje</h1>
    <ul>
        <li th:each="reservation : ${reservations}">
            <span th:text="${reservation.status}">Status</span>
            <span th:text="${reservation.dataRezerwacji}">Data rezerwacji</span>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(reservations)}">Brak rezerwacji.</p>
</div>
<script src="/js/cookies.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
